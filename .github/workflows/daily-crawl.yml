name: Hourly News Crawl

concurrency:
  group: hourly-news-crawl
  cancel-in-progress: true

on:
  schedule:
    # 每小时执行一次
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements.txt
    
    - name: Setup Chrome browser
      uses: browser-actions/setup-chrome@latest
      
    - name: Setup ChromeDriver
      uses: nanasess/setup-chromedriver@master
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create data directories
      run: |
        mkdir -p data/logs
        mkdir -p data/news
        mkdir -p data/reports
        mkdir -p data/archives
        mkdir -p data/images
        
    - name: Run hourly crawl
      run: python scripts/daily_crawl.py
      
    - name: Check if new files exist
      id: check_files
      run: |
        if [ -f data/new_files.txt ] && [ -s data/new_files.txt ]; then
          echo "has_new_files=true" >> $GITHUB_OUTPUT
        else
          echo "has_new_files=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push new files
      if: steps.check_files.outputs.has_new_files == 'true' && success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/news/*.md || true
        git commit -m "自动爬取新闻 - $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
        git push origin main